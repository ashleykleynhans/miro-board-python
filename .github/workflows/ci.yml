name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".editorconfig"
      - ".env.example"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest
